<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ChainPainter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --desk:#5a5d62; --desk-deep:#484b50; --paper:#fbfaf3; --ink:#161616;
  --chrome:#e6e2d4; --chrome-edge:#9c9684; --accent:#ff5c3a; --muted:#5c5a52;
  --shadow:0 3px 0 var(--chrome-edge);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#45474b; --desk-deep:#35373a; --chrome:#2b2a26; --chrome-edge:#0e0e0c;
    --ink:#f2efe6; --muted:#b5b1a5; --paper:#fbfaf3;
  }
}
:root[data-theme="dark"]{
  --desk:#45474b; --desk-deep:#35373a; --chrome:#2b2a26; --chrome-edge:#0e0e0c;
  --ink:#f2efe6; --muted:#b5b1a5; --paper:#fbfaf3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--desk);
  background-image:radial-gradient(var(--desk-deep) 1px, transparent 1px);
  background-size:8px 8px;
  color:var(--ink);
  font:15px/1.4 "Pixelify Sans", ui-monospace, "Courier New", monospace;
  display:flex; flex-direction:column; min-height:100dvh;
  -webkit-user-select:none; user-select:none;
}
header{display:flex;align-items:baseline;gap:10px;padding:10px 12px 6px}
header{flex-wrap:wrap}
.tipbtn{margin-left:auto;font:inherit;font-size:13px;color:#ffd9d0;background:none;border:0;box-shadow:none;padding:0 10px 0 0;min-height:0;cursor:pointer;border-bottom:2px solid transparent}
.tipbtn:hover,.tipbtn:focus-visible{color:#fff;border-bottom-color:var(--accent);outline:none;transform:none}
.tipbtn:active{transform:none;box-shadow:none}
.tipbtn + .by{margin-left:0}
@media (max-width:719px){ .tipbtn{font-size:12px;padding-right:8px} .tipbtn .long{display:none} .tipbtn + .by{margin-left:auto} }
.tip .dim{font-weight:400;color:var(--muted);font-size:13px}
.tip .row{display:flex;align-items:center;gap:8px;margin:8px 0}
.tip .k{width:64px;color:var(--muted);font-size:13px}
.tip .v{flex:1;font-weight:600;color:var(--ink);text-decoration:none;-webkit-user-select:text;user-select:text}
.tip a.v:hover{color:var(--accent)}
.tip img{display:block;margin:4px auto 12px;border:2px solid var(--chrome-edge);background:#fff;padding:4px;width:200px;height:200px}
header .by{font-size:13px;color:#d6d8dc;text-decoration:none;border-bottom:2px solid transparent}
header .by:hover,header .by:focus-visible{color:#fff;border-bottom-color:var(--accent);outline:none}
header h1{font-size:22px;font-weight:600;color:#fff;letter-spacing:.5px}
header span{color:#d6d8dc;font-size:13px}
header .tipbtn span,header .by span{color:inherit;font-size:inherit}
.bar{background:var(--chrome);border:2px solid var(--chrome-edge);box-shadow:var(--shadow);margin:0 8px;padding:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,.tool{
  font:inherit;font-size:14px;color:var(--ink);background:var(--chrome);
  border:2px solid var(--chrome-edge);box-shadow:var(--shadow);
  padding:4px 10px;cursor:pointer;min-height:30px;line-height:1;
}
button:active,.tool:active{transform:translateY(3px);box-shadow:none}
button:focus-visible,.tool:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.tool[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:#8a2812}
.icon{padding:3px 6px;min-height:28px}
.icon svg{width:16px;height:16px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.setups{display:flex;flex-direction:column;gap:6px;margin:10px 0 14px;max-height:60vh;overflow:auto;font-size:14px}
.setups .srow{display:flex;gap:6px;align-items:stretch}
.setups .setup{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;padding:6px 8px}
.setups .chips{display:flex;flex-wrap:wrap;gap:2px}
.setups .chips i{display:block;width:14px;height:14px;border:1px solid var(--chrome-edge)}
.setups .note{color:var(--muted);font-size:13px}
.tool svg{width:18px;height:18px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spacer{flex:1}
.tools .brk{flex-basis:100%;height:0;margin-bottom:-6px}
main{flex:1;display:flex;flex-direction:column;min-height:0}
.work,.side{display:contents}
.side > *{order:3} .side > .tools,.side > .sec-tools{order:0} .stage{order:1} .side > .sec-color{order:1} .status{order:2} .viewbar{order:2}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;min-height:0;position:relative;overflow:hidden}
.zoomchip{position:absolute;top:12px;right:12px;z-index:4}
.zoomchip[hidden],.intro[hidden]{display:none}
.bar.intro{font-size:13px;color:var(--ink);margin-top:0;margin-bottom:6px;position:relative;padding-right:46px}
#introX{position:absolute;top:6px;right:6px}
.intro .step i{font-style:normal;font-weight:700;display:inline-block;min-width:1.5em;text-align:center;margin-right:2px;background:var(--accent);color:#fff}
.sec.flash .sec-t{color:#fff;text-shadow:0 0 8px #fff}
/* Phones: the page scrolls, and the tools (with Undo/Redo) stay pinned to the top. main must be as tall as its content for sticky to hold. */
@media (max-width:389px){ header .tipbtn span.mid{display:none} }
@media (max-width:719px){ .intro .long{display:none} .status{margin-top:6px} main{flex:1 0 auto} .side > .tools{position:sticky;top:0;z-index:5;margin:0} }
.viewbar{display:none}
.fs{font-size:17px;padding:2px 10px;line-height:1}
.fs[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:#8a2812}
/* Wide screens: canvas fills the left, controls live in a scrollable sidebar on the right. */
@media (min-width:960px) and (min-aspect-ratio:1/1){
  main{flex-direction:row;align-items:stretch;gap:0}
  .work{display:flex;flex-direction:column;flex:1;min-width:0;min-height:0}
  .side{display:flex;flex-direction:column;gap:5px;width:min(440px,42vw);overflow:auto;padding:0 8px 10px 0;flex:none}
  .side > *{order:0}
  .side > .sec-color{order:0}
  .side .bar{margin:0}
  .side .export{margin:0}
  .view .side{display:none}
  .view .work .viewbar{margin:0 8px 10px}
  .side .export{margin:0}
}
.view .bar:not(.viewbar),.view .export{display:none}
.view .viewbar{display:flex;margin:0 8px 10px}
.view .viewbar .title{font-weight:600;font-size:15px;padding:0 4px}
.view canvas#c{cursor:default}
.view header span:not(.by){display:inline}
@media (max-width:719px){
  .stage{flex:none;padding:6px 4px}
  header{padding:8px 10px 4px;flex-wrap:nowrap;gap:8px} header span:not(.by){display:none}
  header h1{font-size:18px;flex:none;white-space:nowrap}
  header .long{display:none !important} header .tipbtn .mid{display:inline}
  .tipbtn{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tipbtn + .by{margin-left:0} header .by{flex:none;white-space:nowrap}
  .secret{margin-left:0;width:16px}
  .view header{flex-wrap:wrap}
  .bar{margin:0 4px;padding:4px}
  canvas#c{box-shadow:3px 3px 0 var(--desk-deep)}
}
canvas#c{background:var(--paper);touch-action:none;transform-origin:0 0;max-width:100%;max-height:100%;border:2px solid var(--chrome-edge);box-shadow:4px 4px 0 var(--desk-deep);image-rendering:auto;cursor:crosshair}
canvas#c[data-tool="move"]{cursor:move}
canvas#c[data-tool="fill"]{cursor:cell}
canvas#c.over{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent),4px 4px 0 var(--desk-deep);cursor:not-allowed}
.palette{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.swatch{width:26px;height:26px;border:2px solid var(--chrome-edge);cursor:pointer;padding:0;min-height:0;box-shadow:none}
.swatch[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:-1px}
.swatch.pastel{display:none}
.swatch.add{background:var(--chrome);color:var(--ink);font:inherit;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;padding-bottom:2px}
.swatch.add:hover{color:var(--accent)}
.hiddenpick{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0;min-height:0}
.palette{position:relative}
.pastels .swatch.pastel{display:block}
.secret{width:22px;height:22px;margin-left:6px;background:transparent;border:0;box-shadow:none;padding:0;min-height:0;cursor:default;opacity:0;align-self:center}
.secret:focus-visible{opacity:1;outline:2px dashed #d6d8dc}
label.sl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink)}
label.sl input[type=range]{width:90px;accent-color:var(--accent)}
label.sl output{min-width:2ch;text-align:right}
#layerOpacityOut{min-width:4ch}
input[type=color]{width:32px;height:28px;border:2px solid var(--chrome-edge);background:var(--chrome);padding:0;cursor:pointer}
.export{margin:0 8px 10px;display:flex;flex-direction:column;gap:6px}
.export .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.primary{background:var(--accent);color:#fff;border-color:#8a2812;font-weight:600}
.stat{font-size:13px;color:#e3e5e8}
.layer .eye{opacity:.9}
textarea{width:100%;height:120px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;background:var(--chrome);color:var(--ink);border:2px solid var(--chrome-edge);padding:6px;resize:vertical;display:none;-webkit-user-select:text;user-select:text}
textarea.open{display:block}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#161616;color:#fbfaf3;padding:8px 14px;border:2px solid var(--accent);opacity:0;pointer-events:none;transition:opacity .2s;font-size:14px;max-width:90vw}
.toast.show{opacity:1}
select{font:inherit;font-size:14px;background:var(--chrome);color:var(--ink);border:2px solid var(--chrome-edge);padding:3px 6px;min-height:30px}
.layers{display:flex;gap:4px;flex-wrap:wrap;align-items:center;flex:1}
.layer{display:flex;align-items:center;gap:6px;padding:3px 8px;min-height:30px;font-size:14px;white-space:nowrap}
.layer[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:#8a2812}
.layer .eye{opacity:.9}
.layer[data-hidden="1"]{opacity:.5;text-decoration:line-through}
.small{padding:4px 8px;font-size:13px}
input[type=file]{display:none}
.field{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);flex:1;min-width:140px}
.field input[type=text]{flex:1;min-width:0;font:inherit;font-size:14px;padding:4px 8px;min-height:30px;border:2px solid var(--chrome-edge);background:var(--paper);color:#161616;-webkit-user-select:text;user-select:text}
.budget{font-size:13px;color:var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap}
.budget i{display:inline-block;width:110px;height:10px;border:2px solid var(--chrome-edge);background:var(--paper);position:relative}
.budget i b{position:absolute;inset:0;width:var(--p,0%);background:#2fb36a}
.budget i::after{content:'';position:absolute;top:0;bottom:0;left:8.33%;width:2px;background:var(--chrome-edge);opacity:.7}   /* the 4 KB mark on a 48 KB bar */
.budget[data-tier="1"] i b{background:#e3b01e}
.budget[data-tier="2"] i b{background:var(--accent)}
.budget[data-tier="2"]{color:var(--accent);font-weight:600}
.budget{white-space:normal;flex-wrap:wrap}
.sec{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#d6d8dc;margin:4px 8px -2px}
.sec .dim{font-weight:400;text-transform:none;letter-spacing:0;opacity:.8}
.side .sec{margin:8px 0 0}
.side .sec:first-child{margin-top:0}
.side .sec + *{margin-top:0}
/* Collapsible sections: the heading is a button; a collapsed heading hides the block right after it. */
.sec-t{all:unset;box-sizing:border-box;display:flex;align-items:baseline;gap:6px;width:100%;padding:3px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sec-t::before{content:'▾';display:inline-block;width:.9em;font-size:11px;transition:transform .12s}
.sec-t:hover{color:#fff}
.sec-t:active{transform:none}
.sec-t:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.sec-t .dim{display:none;margin-left:auto;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec.collapsed .sec-t::before{transform:rotate(-90deg)}
.sec.collapsed .sec-t .dim{display:inline}
.sec.collapsed{border-bottom:1px solid rgba(255,255,255,.2)}
.sec.collapsed + *{display:none !important}
@media (prefers-reduced-motion:reduce){.sec-t::before{transition:none}}
.frames{display:none;margin:0 8px 8px}
body.anim .frames{display:flex}
body.anim #framesRow{display:none}
body.anim #play{display:none}
body.view .frames{display:none !important}
.frames{order:1}
.frlist{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.fr{min-width:32px;padding:3px 8px;min-height:28px;font-size:13px;position:relative}
.fr[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:#8a2812}
.fr .dot{position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
#allFrames[aria-pressed="true"],#onion[aria-pressed="true"],#animMode[aria-pressed="true"],#glitchLayer[aria-pressed="true"],#fplay[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:#8a2812}
.status{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 8px 8px;padding:6px 8px;background:var(--chrome);border:2px solid var(--chrome-edge);box-shadow:var(--shadow);font-size:13px}
.status .stat{color:var(--muted)}
.status #fit{display:none}
.status[data-over="1"] #fit{display:inline-block;background:var(--accent);color:#fff;border-color:#8a2812}
.view .status{display:none}
button:disabled{opacity:.45;cursor:default;transform:none;box-shadow:var(--shadow)}
.layer .eye{opacity:.9;cursor:pointer;padding:0 2px}
.layer .wig{font-size:11px;opacity:.8;border:1px solid currentColor;padding:0 4px;margin-left:2px}
#wigScope[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:#8a2812}
.layer .eye:hover{color:var(--accent)}
.dlg .keys{display:grid;grid-template-columns:max-content 1fr;gap:8px 12px;align-items:center;margin:10px 0 14px;font-size:14px;max-height:66vh;overflow:auto}
.dlg .keys .h{grid-column:1 / -1;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.dlg .keys .h:first-child{margin-top:0}
.dlg kbd{font:inherit;font-size:13px;background:var(--paper);color:#161616;border:1px solid var(--chrome-edge);box-shadow:0 2px 0 var(--chrome-edge);padding:2px 7px;white-space:nowrap;justify-self:start;line-height:1.3}
.dlg.wide{max-width:600px}
@media (min-width:600px){ .dlg .keys{grid-template-columns:max-content 1fr max-content 1fr;column-gap:14px} .dlg .keys .h + kbd{grid-column:1} }
.export .hint{font-size:12px;color:#d6d8dc}
.export .hint a{color:#fff}
.hint code{font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.25);padding:1px 4px;color:#fff}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.veil.open{display:flex}
.dlg{background:var(--chrome);color:var(--ink);border:2px solid var(--chrome-edge);box-shadow:6px 6px 0 var(--desk-deep);padding:14px;max-width:360px;width:100%}
.dlg p{margin-bottom:10px;font-size:15px}
.dlg input{width:100%;font:inherit;font-size:15px;padding:8px;border:2px solid var(--chrome-edge);background:var(--paper);color:#161616;margin-bottom:10px;-webkit-user-select:text;user-select:text}
.dlg .btns{display:flex;gap:6px;justify-content:flex-end}
.dlg .ok{background:var(--accent);color:#fff;border-color:#8a2812}
@media (min-width:720px){ label.sl input[type=range]{width:130px} }
</style>
</head>
<body>
<header><h1>ChainPainter</h1><span id="tagline">Draw Animated SVGs - Mint On-Chain</span><button class="tipbtn" id="tipBtn"><span class="long">enjoy this app? </span>tip <span class="mid">the artist </span>♥</button><a class="by" href="https://bryanbrinkman.com" target="_blank" rel="noopener"><span class="long">made </span>by Brinkman ↗</a><button class="secret" id="secret" aria-label="Toggle Brinkman pastels" tabindex="-1"></button></header>

<main>
<section class="work">
<div class="bar intro" id="intro" hidden>
  <b>New here?</b>
  <span class="step"><i>1</i> Draw<span class="long"> on the canvas</span></span>
  <button class="small step" data-go="export" title="Open Export &amp; share"><i>2</i> Export<span class="long"> or share it</span></button>
  <button class="small step" data-go="mint" title="Open Mint onchain"><i>3</i> Mint<span class="long"> it onchain</span></button>
  <button class="small" id="introX" title="Hide this tip" aria-label="Hide this tip">×</button>
</div>
<div class="stage"><canvas id="c" aria-label="Drawing canvas"></canvas><button class="small zoomchip" id="zoomReset" hidden title="Reset zoom (pinch, or Ctrl/⌘ + scroll, to zoom)">100% ×</button></div>
<div class="bar frames" id="framesBar" aria-label="Frames">
  <button class="small" id="frPrev" title="Previous frame ( , )">◀</button>
  <div class="frlist" id="frlist"></div>
  <button class="small" id="frNext" title="Next frame ( . )">▶</button>
  <button class="small" id="fplay" title="Play / pause (Space)">Play</button>
  <span class="spacer"></span>
  <button class="small" id="frAdd" title="Add an empty frame after this one">+ Frame</button>
  <button class="small" id="frDup" title="Duplicate this frame">Duplicate</button>
  <button class="small" id="frDel" title="Delete this frame">Delete</button>
  <button class="small" id="allFrames" aria-pressed="false" title="New strokes appear on every frame (backgrounds, holds)">All frames</button>
  <button class="small" id="onion" aria-pressed="true" title="Show the previous and next frames faintly">Onion</button>
</div>
<div class="status" id="status" aria-live="polite">
  <span class="budget" id="budget" data-tier="0"><i><b></b></i><span id="budgetOut">0 KB</span></span>
  <span class="stat" id="stat">0 strokes</span>
  <span class="spacer"></span>
  <button class="small" id="fit" title="Simplify strokes (then reduce frames) until the SVG is back under 48 KB">Fit to 48 KB</button>
</div>

<div class="bar viewbar" aria-label="Shared drawing">
  <span class="title" id="vtitle"></span>
  <span class="spacer"></span>
  <button id="vplay">Pause</button>
  <button id="vfs" class="fs" title="Full screen">⛶</button>
  <button id="vdownload">Download SVG</button>
  <button id="vshare">Copy link</button>
  <button id="vshareNative" class="native" hidden>Share…</button>
  <button class="primary" id="remix">Remix in ChainPainter</button>
</div>
</section>

<aside class="side">
<h2 class="sec sec-tools">Tools</h2>
<div class="bar tools" role="toolbar" aria-label="Tools">
  <button class="tool" data-tool="pen" aria-pressed="true" title="Pencil (P)"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg></button>
  <button class="tool" data-tool="line" aria-pressed="false" title="Line (L)"><svg viewBox="0 0 24 24"><path d="M4 20L20 4"/></svg></button>
  <button class="tool" data-tool="rect" aria-pressed="false" title="Rectangle (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12"/></svg></button>
  <button class="tool" data-tool="ellipse" aria-pressed="false" title="Ellipse (O)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg></button>
  <button class="tool" data-tool="eraser" aria-pressed="false" title="Eraser (E)"><svg viewBox="0 0 24 24"><path d="M3 15l9-9 7 7-6 6H8z M8 19h12"/></svg></button>
  <button class="tool" data-tool="fill" aria-pressed="false" title="Fill (G): tap an enclosed area to fill it; tap a fill to recolour it"><svg viewBox="0 0 24 24"><path d="M5 12l7-7 7 7-7 7z M12 5V3 M19 12c0 0 2 2.5 2 4a2 2 0 0 1-4 0c0-1.5 2-4 2-4z M5 12h14"/></svg></button>
  <button class="tool" data-tool="move" aria-pressed="false" title="Move layer (V): drag, or arrow keys (Shift = 10 px)"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3m3-3l3 3M12 21l-3-3m3 3l3-3M3 12l3-3m-3 3l3 3M21 12l-3-3m3 3l-3 3"/></svg></button>
  <span class="brk"></span>

<script>

// segment after the first therefore costs one coordinate pair. Midpoints are chosen from the *actual*
// (reflected) control so rounding never accumulates: every control stays within 1 px of its vertex.
// Relative coordinates + implicit repeated commands. The same string feeds the canvas preview and the export.

// ---------- SVG export ----------
// Self-contained SMIL animation: each path cycles its jittered frames. Eraser strokes become a per-layer mask.
// The drawing is written once per frame as a frame group; one <animate> per group toggles which is displayed.
// Frame 0 is the static fallback. Inside a frame, consecutive strokes with the same colour and width share
// a <g> so the attributes aren't repeated per path. Eraser strokes become a per-layer, per-frame mask.
function toSVG(){
  const hasFrames = S.layers.some(L => L.visible && L.strokes.some(st => st.f !== undefined));
  const animated = S.frames > 1 && (hasFrames || S.layers.some(L => L.visible && (layerAmp(L) > 0 || L.glitch))), F = animated ? S.frames : 1;
  const dur = (F / S.fps).toFixed(3);

    .filter(x => x.L.visible && x.L.strokes.some(st => !st.erase));
  // Emit strokes as colour/width runs; a run may continue across layers when nothing separates them.
  function runs(items, colored){
    let out = '', cur = null;
    for (const { st, d } of items){
      const key = st.fill ? 'F' + st.color : (colored ? st.color : '') + '|' + st.size;
      if (key !== cur){
        if (cur !== null) out += '</g>';
        out += st.fill ? `<g fill="${st.color}" fill-rule="evenodd" stroke="${st.color}" stroke-width="2">` : `<g${colored ? ` stroke="${st.color}"` : ''} stroke-width="${st.size}">`;
        cur = key;
      }
      out += `<path d="${d}"/>`;
    }
    return cur === null ? '' : out + '</g>';
  }
  let defs = '', body = '';

  for (let f = 0; f < F; f++){
    let frame = '', pending = [];
    const flush = () => { frame += runs(pending, true); pending = []; };
    layers.forEach(({ L, li, paths }) => {
      const paints = [], erases = [];
      L.strokes.forEach((st, i) => { if (inFrame(st, f)) (st.erase ? erases : paints).push({ st, d: paths[i][f] }); });
      const glitch = L.glitch && paints.length, alpha = layerAlpha(L);

      const group = `<g${glitch ? ` id="${gid}"` : ''}${alpha < 1 ? ` opacity="${alphaAttr(alpha)}"` : ''}${erases.length ? ` mask="url(#${id})"` : ''}>${runs(paints, true)}</g>`;
      if (!glitch){ frame += group; return; }

      const g = glitchFrame(li, f);

    });

}

// ---------- on-chain size tiers ----------
// The SVG's byte size decides how it is minted (see the mint module):
//   green  up to 4 KB   one transaction, the SVG goes inline in the mint
//   yellow up to 48 KB  two transactions: store the SVG in the ABX chunk store, then mint
//   red    up to 96 KB  several store transactions, then mint; costs the most, so the price is shown
// Drawing is blocked at 96 KB: past that, some providers can no longer read the token back.
const TIER_SINGLE = 4096, BUDGET = 48 * 1024, HARD_LIMIT = 96 * 1024, CHUNK_BYTES = 22000;
const utf8 = str => new TextEncoder().encode(str);
function b64(str){ let bin = ''; utf8(str).forEach(b => bin += String.fromCharCode(b)); return btoa(bin); }
function tokenName(){ return ($('tokName').value.trim() || S.name || 'untitled').slice(0, 80); }
function fmtKB(n){ return (n / 1024).toFixed(1) + ' KB'; }
const budgetBytes = svg => utf8(svg || toSVG()).length;
const LIMIT = () => HARD_LIMIT;
const tierOf = n => n <= TIER_SINGLE ? 0 : n <= BUDGET ? 1 : 2;
// Transactions and a rough gas figure for minting n bytes (inline ≈ 720 gas/byte; chunk store ≈ 240 gas/byte plus fixed costs).
function mintPlan(n){
  if (n <= TIER_SINGLE) return { tx: 1, gas: 150000 + n * 720 };
  const chunks = Math.ceil(n / CHUNK_BYTES);
  if (n <= BUDGET) return { tx: 2, gas: 21000 + chunks * 40000 + n * 240 + 60000 + 330000 };
  const batches = Math.ceil(chunks / 2);
  return { tx: batches + 2, gas: batches * 21000 + chunks * 40000 + n * 240 + 120000 + 330000 };
}
// Current gas price for the selected network, asked through the mint module (wallet if connected, else a public endpoint). Cached for a minute.
let gasQuote = null;
async function refreshGasQuote(){
  const ask = window.ChainPainter && window.ChainPainter.gasPrice; if (!ask) return null;
  if (gasQuote && gasQuote.chain === S.abxChain && Date.now() - gasQuote.at < 60000) return gasQuote;
  try { const q = await ask(); if (q && q.wei != null){ gasQuote = { ...q, at: Date.now(), chain: S.abxChain }; return gasQuote; } } catch {}
  return null;
}
const freshQuote = () => gasQuote && gasQuote.chain === S.abxChain && Date.now() - gasQuote.at < 300000 ? gasQuote : null;
function priceText(gas, q){   // "≈ 0.012 ETH at 0.8 gwei" or, with no price available, the gas figure
  if (!q) return 'about ' + (gas / 1e6).toFixed(1) + 'M gas';
  const eth = Number(BigInt(Math.round(gas)) * q.wei) / 1e18, gwei = Number(q.wei) / 1e9;
  return '≈ ' + eth.toLocaleString(undefined, { maximumSignificantDigits: 2 }) + ' ' + q.sym + (q.testnet ? ' (testnet, free)' : '') + ' at ' + gwei.toLocaleString(undefined, { maximumSignificantDigits: 2 }) + ' gwei';
}
let lastTier = 0, budgetSeq = 0;
function updateBudget(svg){
  const n = budgetBytes(svg), tier = tierOf(n), plan = mintPlan(n), el = $('budget'), seq = ++budgetSeq;
  el.dataset.tier = String(tier); el.dataset.over = tier === 2 ? '1' : '0'; $('status').dataset.over = el.dataset.over; cv.classList.toggle('over', n > LIMIT());
  el.querySelector('b').style.setProperty('--p', Math.min(100, n / BUDGET * 100) + '%');
  const paint = () => { $('budgetOut').textContent = fmtKB(n) + (tier === 2 ? ' · over 48 KB · ' + plan.tx + ' txns to mint · ' + priceText(plan.gas, freshQuote()) : ' / 48 KB · ' + plan.tx + (plan.tx === 1 ? ' txn' : ' txns') + ' to mint'); };
  paint();
  el.title = ['Green: up to 4 KB mints in one transaction.', 'Yellow: 4 to 48 KB mints in two transactions (store the image, then mint).', 'Red: over 48 KB needs several store transactions and costs the most. Drawing stops at 96 KB.'][tier];
  const entered = tier === 2 && lastTier !== 2; lastTier = tier;
  if (tier === 2) refreshGasQuote().then(q => {
    if (seq === budgetSeq) paint();
    if (entered) toast('Over 48 KB: minting this takes ' + plan.tx + ' transactions, ' + priceText(plan.gas, q) + (q ? '' : '. Connect a wallet to see the price') + '. Fit to 48 KB brings it back to two.');

}
function renderFitBtn(){ $('fit').textContent = fitBackup ? 'Undo fit' : 'Fit to 48 KB'; $('fit').style.display = fitBackup ? 'inline-block' : ''; }
function snapshot(){ return JSON.stringify({ frames: S.frames, layers: S.layers.map(L => L.strokes) }); }

// Re-simplify freehand strokes with a growing tolerance, then drop to 2 frames, until the token URI fits.
async function fitToBudget(){
  if (fitBackup){ fitting = true; restoreSnapshot(fitBackup); fitBackup = null; fitting = false; invalidate(); draw(); toast('Fit undone'); return; }
  const before = budgetBytes();
  if (before <= BUDGET){ toast('Already under 48 KB'); return; }
  if (!(await ask('Simplify strokes until the SVG is under 48 KB? You can undo this until you draw again.'))) return;
  const backup = snapshot();
  const strokes = S.layers.flatMap(L => L.strokes.filter(st => !st.closed || st.fill));
  // Gentle simplification first, then one frame at a time, then heavier simplification as a last resort.
  const steps = [2, 3, 4, 6, 'frame', 'frame', 'frame', 8, 12];
  let n = before;
  for (const step of steps){
    if (step === 'frame'){ if (S.frames <= 2) continue; S.frames--; $('frames').value = S.frames; $('framesOut').value = S.frames; }
    else strokes.forEach(st => {
      if (st.fill){ st.pts = simplifyClosed(st.pts, step); if (st.holes) st.holes = st.holes.map(h => simplifyClosed(h, step)).filter(h => h.length >= 3); }
      else st.pts = simplify(st.pts, step);
    });
    n = budgetBytes(); if (n <= BUDGET) break;
  }
  fitting = true; fitBackup = backup; invalidate(); fitting = false; renderFitBtn(); draw();
  toast(n <= BUDGET ? 'Fits: ' + fmtKB(before) + ' → ' + fmtKB(n) : 'Still ' + fmtKB(n) + ' after simplifying — remove some strokes or layers');
}

// ---------- GIF export ----------
// Renders every wiggle frame at 2× (longest side capped at 1024 px), quantises to a 256-colour palette
// with median cut, LZW-encodes each frame and loops forever at the piece's speed. No dependencies.
function renderFrameTo(f, k){
  if (!cache) buildCache();
  const W = Math.round(S.w * k), H = Math.round(S.h * k);
  const out = document.createElement('canvas'); out.width = W; out.height = H; const oc = out.getContext('2d');
  oc.fillStyle = S.bg; oc.fillRect(0, 0, W, H);
  const lay = document.createElement('canvas'); lay.width = W; lay.height = H; const lc = lay.getContext('2d');
  S.layers.forEach((L, li) => {
    if (!L.visible || !L.strokes.length) return;
    lc.setTransform(1, 0, 0, 1, 0, 0); lc.globalCompositeOperation = 'source-over'; lc.clearRect(0, 0, W, H); lc.scale(k, k);
    for (const e of cache[li]) if (inFrame(e.st, f)) paintStroke(lc, e.st, e.paths[f % e.paths.length]);
    if (L.glitch) drawGlitch(oc, lay, li, f, k, layerAlpha(L)); else { oc.globalAlpha = layerAlpha(L); oc.drawImage(lay, 0, 0); oc.globalAlpha = 1; }
  });

}
function medianCut(samples, maxColors){
  // samples: flat [r,g,b,...]; returns array of [r,g,b]
  let boxes = [Array.from({ length: samples.length / 3 }, (_, i) => i)];
  const range = box => { let lo = [255, 255, 255], hi = [0, 0, 0]; for (const i of box) for (let c = 0; c < 3; c++){ const v = samples[i * 3 + c]; if (v < lo[c]) lo[c] = v; if (v > hi[c]) hi[c] = v; } return [hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]]; };
  while (boxes.length < maxColors){
    let bi = -1, best = 0, bc = 0;
    boxes.forEach((box, i) => { if (box.length < 2) return; const r = range(box); const m = Math.max(...r); if (m > best){ best = m; bi = i; bc = r.indexOf(m); } });
    if (bi < 0 || best === 0) break;
    const box = boxes[bi]; box.sort((a, b) => samples[a * 3 + bc] - samples[b * 3 + bc]);
    const mid = box.length >> 1; boxes.splice(bi, 1, box.slice(0, mid), box.slice(mid));
  }
  return boxes.map(box => { let r = 0, g = 0, b = 0; for (const i of box){ r += samples[i * 3]; g += samples[i * 3 + 1]; b += samples[i * 3 + 2]; } const n = box.length || 1; return [Math.round(r / n), Math.round(g / n), Math.round(b / n)]; });
}
function lzwEncode(indices, minCodeSize, push){

  emit(clear);
  let prev = indices[0];

async function downloadGIF(){
  if (!totalStrokes()){ toast('Draw something first'); return; }

    const F = (S.layers.some(L => L.visible && layerAmp(L) > 0) || S.layers.some(L => L.visible && L.strokes.some(st => st.f !== undefined))) ? S.frames : 1;
    const k = Math.min(2, 1024 / Math.max(S.w, S.h));
    const frames = []; for (let f = 0; f < F; f++) frames.push(renderFrameTo(f, k));
    const W = frames[0].width, H = frames[0].height;
    // palette from a sample of every frame
    const samples = []; const step = Math.max(1, Math.floor((W * H * F) / 40000));
    for (const fr of frames) for (let i = 0; i < fr.data.length; i += 4 * step){ samples.push(fr.data[i], fr.data[i + 1], fr.data[i + 2]); }
    const pal = medianCut(samples, 256); while (pal.length < 256) pal.push([0, 0, 0]);
    const nearest = new Map();
    const idx = (r, g, b) => { const key = ((r >> 2) << 12) | ((g >> 2) << 6) | (b >> 2); let v = nearest.get(key); if (v !== undefined) return v; let best = 0, bd = Infinity; for (let i = 0; i < pal.length; i++){ const d = (pal[i][0] - r) ** 2 + (pal[i][1] - g) ** 2 + (pal[i][2] - b) ** 2; if (d < bd){ bd = d; best = i; } } nearest.set(key, best); return best; };

    if (F > 1){ push(0x21); push(0xFF); push(11); for (const c of 'NETSCAPE2.0') push(c.charCodeAt(0)); push(3); push(1); u16(0); push(0); }

      push(0x2C); u16(0); u16(0); u16(W); u16(H); push(0);

    setTimeout(() => URL.revokeObjectURL(a.href), 2000);

}

// ---------- share links ----------
// The whole project is deflated and base64url-encoded into the URL fragment: #v=1.<data> (1 = deflate-raw,
// 0 = plain). Nothing leaves the browser; the link doubles as a backup and can be remixed by anyone.
const b64u = {
  enc: bytes => { let bin = ''; for (const b of bytes) bin += String.fromCharCode(b); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  dec: str => Uint8Array.from(atob(str.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)),
};

async function shareURL(){
  const raw = utf8(projectJSON());
  let payload;
  try { payload = '1.' + b64u.enc(await pipe(raw, new CompressionStream('deflate-raw'))); }
  catch { payload = '0.' + b64u.enc(raw); }
  return location.href.split('#')[0] + '#v=' + payload;
}
async function projectFromHash(){
  const m = location.hash.match(/^#v=([01])\.([A-Za-z0-9_-]+)$/); if (!m) return null;
  let bytes = b64u.dec(m[2]);
  if (m[1] === '1') bytes = await pipe(bytes, new DecompressionStream('deflate-raw'));

const rdnsOf = p => (providers.find(x => x.provider === p) || { info: {} }).info.rdns || '';
async function connect(p){

  try {

// Returning visitors: eth_accounts never opens a prompt, it only answers if this site is still approved in the wallet.
let reconnecting = false;
async function reconnect(){
  if (account || reconnecting) return;
  let saved = null; try { saved = JSON.parse(localStorage.getItem(LS_WALLET) || 'null'); } catch {}
  if (!saved) return;
  const match = providers.find(x => x.info.rdns === saved.rdns);
  const p = match ? match.provider : (saved.rdns ? null : window.ethereum);   // a named wallet that has not announced itself yet: retried on announce
  if (!p) return;
  reconnecting = true;
  try { const accs = await p.request({ method: 'eth_accounts', params: [] }); if (accs && accs[0]){ await attach(p, accs); render(); refreshMeter(); } } catch {}
  reconnecting = false;
}

async function switchChain(key){
  const c = CHAINS[key]; const hex = '0x' + c.id.toString(16);

    if (e && (e.code === 4902 || /unrecognized|not added|4902/i.test(e.message || ''))){

// Images staged in the chunk store are remembered by content hash, so a retry after a cancelled mint does not pay to store them again.

async function reviewArtwork(){
  const c = wanted(); const coll = selected();

  if (!CP().strokes()){ setStatus('Draw something first.', 'err'); return; }

    const owner = decodeAddress(await call(coll.address, view('owner')));
    if (owner.toLowerCase() !== account.toLowerCase()) throw new Error('This wallet (' + short(account) + ') does not own ' + coll.name + '; its owner is ' + short(owner) + '.');
    const next = decodeUint(await call(coll.address, view('nextTokenId'))), max = decodeUint(await call(coll.address, view('maxInvocations')));
    if (next >= max) throw new Error(coll.name + ' is full: all ' + max + ' artworks are minted. Create a new contract.');
    const link = form.link.trim(); if (!validLink(link)) throw new Error('The external link must start with http:// or https://.');
    const svg = CP().svg(), raw = utf8(svg); const piece = { name: CP().name(), description: CP().desc(), svg, attributes: attributesJSON(form.traits), externalUrl: link };
    // Small drawings go inline in one transaction. Larger ones are stored in the ABX chunk store first, then minted pointing at them.
    let chunked = false;

    } else {

      if (!manifest && raw.length <= SINGLE_STORE_MAX){

      } else if (!manifest){

// Step 2: send exactly what was reviewed. An artwork is one or more transactions: store the image (if it is large), then mint.
const STEP_NAME = { content: 'storing the image on-chain', chunks: 'storing part of the image on-chain', manifest: 'linking the stored parts', mint: 'minting' };

  busy = true; txState = { ...t, stage: 'signing', label: steps ? pre(0) + 'confirm ' + STEP_NAME[steps[0].kind] + ' in your wallet…' : 'Confirm in your wallet…' }; render();
  let stepsDone = 0;

    if (t.kind === 'contract'){
      const { hash, receipt } = await sendTx(t.to, t.data, t.gas, 'Creating the contract…');
      const code = await rpc('eth_getCode', [t.predicted, 'latest']).catch(() => '0x');
      if (!code || code === '0x') throw new Error('Confirmed, but no contract found at ' + t.predicted + '. Check the transaction.');
      remember(t.coll); pick = t.predicted; form.collName = '';
      txState = { ...t, stage: 'done', hash, receipt, contract: t.predicted };
    } else {
      let manifest = t.manifest; const pointers = t.pointers ? [...t.pointers] : null; let last = null;
      const settle = async m => {   // a manifest exists: check what it serves is exactly the drawing, then remember it
        if (!m) throw new Error('The image was stored, but its address could not be read from the receipt. Check the transaction.');
        if (!(await storedMatches(m, t.raw))) throw new Error('The stored image does not match the drawing, so nothing was minted.');
        stagedPut(t.stagedKey, m); return m;
      };
      for (let i = 0; i < N; i++){
        const st = steps[i], cap = s0 => s0.charAt(0).toUpperCase() + s0.slice(1);
        if (i > 0){ txState = { ...txState, stage: 'signing', label: pre(i) + 'confirm ' + STEP_NAME[st.kind] + ' in your wallet…' }; render(); }
        const going = pre(i) + STEP_NAME[st.kind] + '…';
        if (st.kind === 'content') manifest = await settle(manifestFrom((await sendTx(CHUNK_STORE, st.data, st.gas, going)).receipt));
        else if (st.kind === 'chunks'){
          const ptrs = chunkPointersFrom((await sendTx(CHUNK_STORE, st.data, st.gas, going)).receipt);
          if (ptrs.length !== st.idxs.length) throw new Error('Expected ' + st.idxs.length + ' stored parts in the receipt, found ' + ptrs.length + '. Check the transaction.');

        } else if (st.kind === 'manifest'){

        } else {
          const data = t.chunked ? encodeMintPiece(t.tokenId, { ...t.piece, imageReader: readerValue(manifest) }, account) : st.data;

    }
  } catch (e){
    txState = { ...t, stage: 'error', hash: txState.hash, msg: friendly(e) + (stepsDone > 0 ? ' What is already stored on-chain is kept: press Mint artwork again to carry on from there. You will not pay for it twice.' : '') };
  }
  busy = false; render();
}
// Current gas price for the selected network: the connected wallet's view if it is on that network, else a public endpoint.
async function gasQuoteNow(){
  const c = wanted(); let wei = null;
  if (eth && account && chainId === c.id){ try { wei = BigInt(await rpc('eth_gasPrice')); } catch {} }
  for (const url of wei == null ? c.rpc : []){
    try {
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 4000);
      const res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_gasPrice', params: [] }), signal: ctl.signal });
      clearTimeout(tm); const j = await res.json(); if (j && typeof j.result === 'string'){ wei = BigInt(j.result); break; }
    } catch {}

const GALLERY_MAX = 12;

function parseTokenURI(uri){
  const i = uri.indexOf(','); if (!/^data:application\/json/i.test(uri) || i < 0) throw new Error('unexpected tokenURI');

  const text = /;base64$/i.test(uri.slice(0, i)) ? new TextDecoder().decode(Uint8Array.from(atob(body), ch => ch.charCodeAt(0))) : decodeURIComponent(body);

}

function friendly(e){

  // Wallets built on viem put the real reason after a dump of the whole request ("Request body: {…} Details: …"). Keep the reason, drop the dump.
  const det = /Details:\s*([\s\S]*?)(?:\s+Version:|\s+\|\s|$)/.exec(m), reason = det ? det[1].trim() : '';
  m = m.replace(/Request body:\s*[\s\S]*?(?=\s+Details:|\s+Version:|\s+\|\s|$)/g, '').replace(/Details:\s*[\s\S]*?(?=\s+Version:|\s+\|\s|$)/g, '').replace(/Version:\s*\S+/g, '').replace(/\s+/g, ' ').trim();
  const all = reason + ' ' + m;
  if (/user rejected|user denied|rejected the request|\b4001\b/i.test(all)) return 'You cancelled in the wallet.';
  if (/insufficient funds|insufficient balance/i.test(all)) return 'Not enough ' + wanted().sym + ' in this wallet for gas.';
  if (/SaltSenderMismatch/i.test(all)) return 'Salt/sender mismatch: reconnect the wallet and try again.';
  if (/Unauthorized/i.test(all)) return 'The contract refused: this wallet is not its owner.';
  if (/exceeds allowance|more than one transaction may use|exceeds (the )?(block|transaction|tx) gas|gas limit (is )?too high|max(imum)? (transaction |tx )?gas|out of gas/i.test(all))
    return 'This needs more gas than a single transaction may use' + (reason ? ' (' + reason.slice(0, 100) + ')' : '') + '. Try a smaller drawing: fewer strokes, fills or frames.';
  if (/\b413\b|too large|payload|body (size )?limit/i.test(all)) return "The wallet's network provider refused a request this big. Switch the wallet to another RPC, or try a smaller drawing.";
  let out = reason ? reason + (m ? ' · ' + m.slice(0, 110) : '') : m;
  if (/RPC Request failed|HTTP request failed|Failed to fetch|network error/i.test(out) && !reason) out += " The wallet's network provider (RPC) gave no reason. Try again, or switch the wallet to a different RPC.";
  return out.length > 300 ? out.slice(0, 300) + '…' : out;
}
const short = a => a ? a.slice(0, 6) + '…' + a.slice(-4) : '';
